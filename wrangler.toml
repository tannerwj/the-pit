name = "the-pit"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

# D1 database for The Pit (paper trading; all money virtual)
[[d1_databases]]
binding = "DB"
database_name = "the-pit"
database_id = "6c6c2e4c-3a58-4a25-9ca3-13bee2710b1e"
migrations_dir = "migrations"

# Quote ingest every minute; equity snapshots + scoring every 5 minutes
[triggers]
crons = ["*/1 * * * *", "*/5 * * * *"]
